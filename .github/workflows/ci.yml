name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      # Network tests hit live yfinance and are flaky in CI; the offline
      # suite covers the CSP, KB, anomaly detector, ranking, formatting,
      # ticker detection, and agent construction.
      - name: Offline tests
        run: pytest -v -m "not network"
